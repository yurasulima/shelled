```yaml
name: .NET CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Shelled.sln

      - name: Build
        run: dotnet build Shelled.sln --configuration Release --no-restore

      - name: Publish
        run: dotnet publish Shelled.sln --configuration Release --no-restore -o ./publish

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Shelled-Windows-Release
          path: ./publish/
          if-no-files-found: error
          retention-days: 14
```
